
name: Build Manutenção Industrial LD V2 TESTE

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos da branch V2
        uses: actions/checkout@v4

      - name: Conferir base V2
        run: |
          test -f www/index.html
          test -f www/app.js
          test -f www/style.css
          test -f www/assets/ld-logo-watermark.png
          test -f package.json
          test -f capacitor.config.json
          grep -q 'br.com.ldautomacao.manutencaoindustrial.v2teste' capacitor.config.json

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Preparar biblioteca de PDF
        run: npm run build

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK V2
        uses: actions/upload-artifact@v4
        with:
          name: manutencao-industrial-ld-v2-teste-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
 
