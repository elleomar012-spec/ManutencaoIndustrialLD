
name: Build Manutenção Industrial LD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Extrair base V3 corrigida
        run: |
          unzip -o ManutencaoIndustrialLD-V2-BASE-V3-CORRIGIDA.zip -d .
          test -f www/index.html
          test -f www/app.js
          test -f package.json

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Preparar aplicativo
        run: npm run build

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: manutencao-industrial-ld-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
