
name: Build Manutenção Industrial LD V2 TESTE

on:
  workflow_dispatch:
  push:
    branches:
      - v2.2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos da branch V2
        uses: actions/checkout@v4

      
      - name: Conferir base V2
        run: |
          echo "Conferindo arquivos da V2.0..."
          for arquivo in \
            www/index.html \
            www/app.js \
            www/style.css \
            www/assets/ld-logo-watermark.png \
            package.json \
            capacitor.config.json
          do
            if [ -f "$arquivo" ]; then
              echo "OK: $arquivo"
            else
              echo "::error::ARQUIVO AUSENTE: $arquivo"
              exit 1
            fi
          done
          grep -q 'br.com.ldautomacao.manutencaoindustrial.v2teste' capacitor.config.json || {
            echo "::error::Identificador Android da V2 incorreto"
            exit 1
          }
          echo "Base V2 conferida com sucesso!"


      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Preparar biblioteca de PDF
        run: npm run build

      - name: Criar projeto Android
        run: npx cap add android

            - name: Aplicar icone oficial LD
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from PIL import Image
          import os

          origem = "www/assets/icon-ld-v22.png"
          imagem = Image.open(origem).convert("RGBA")

          tamanhos = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for pasta, tamanho in tamanhos.items():
              destino = f"android/app/src/main/res/{pasta}"
              os.makedirs(destino, exist_ok=True)
              icone = imagem.resize((tamanho, tamanho), Image.Resampling.LANCZOS)
              icone.save(f"{destino}/ic_launcher.png")
              icone.save(f"{destino}/ic_launcher_round.png") 
              icone.save(f"{destino}/ic_launcher_foreground.png")

          print("Icone oficial LD aplicado com sucesso!")
          PY

      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK V2
        uses: actions/upload-artifact@v4
        with:
          name: manutencao-industrial-ld-v2-teste-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
