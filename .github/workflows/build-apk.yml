
name: Build Manutenção Industrial LD V2 TESTE

on:
  workflow_dispatch:
  push:
    branches:
      - v2.2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos da branch V2
        uses: actions/checkout@v4

      
      - name: Conferir base V2
        run: |
          echo "Conferindo arquivos da V2.0..."
          for arquivo in \
            www/index.html \
            www/app.js \
            www/style.css \
            www/assets/ld-logo-watermark.png \
            package.json \
            capacitor.config.json
          do
            if [ -f "$arquivo" ]; then
              echo "OK: $arquivo"
            else
              echo "::error::ARQUIVO AUSENTE: $arquivo"
              exit 1
            fi
          done
          grep -q 'br.com.ldautomacao.manutencaoindustrial.v2teste' capacitor.config.json || {
            echo "::error::Identificador Android da V2 incorreto"
            exit 1
          }
          echo "Base V2 conferida com sucesso!"


      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Preparar biblioteca de PDF
        run: npm run build

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK V2
        uses: actions/upload-artifact@v4
        with:
          name: manutencao-industrial-ld-v2-teste-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
